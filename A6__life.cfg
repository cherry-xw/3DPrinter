
#####################################################################
# Macros 基本指令说明
# M140 S[温度]：设置热床的目标温度，但不等待其达到该温度，而是继续执行后续命令。
# M190 S[温度]：设置热床的目标温度，并等待其达到该温度后才继续执行后续命令。

# M104 S[温度]：设置喷头的目标温度，但不等待其达到该温度，继续执行后续命令。
# M109 S[温度]：设置喷头的目标温度，并等待其达到该温度后才继续执行后续命令。

# G90 绝对坐标
# G91 相对坐标
#####################################################################
#####################################################################
# 生命周期函数
#####################################################################

[gcode_macro PRINT_START]
gcode:
    ; 设置目标温度（可以通过参数传递）
    {% set bed_target = params.BED_TEMP|default(60)|float %}
    {% set extruder_target = params.EXTRUDER_TEMP|default(200)|float %}
    {% set bed_temp_even_time = params.BED_TEMP_EVEN_TIME|default(15)|float %}
    MANUAL_GET_FILAMENT_STATE
    # 舵机悬空挂起
    IDLE_SELECTOR
    M140 S{ bed_target }      ; 不等待设置热床最终目标温度
    SET_GCODE_OFFSET Z=0 MOVE=1  ; 清除所有Z偏移
    BED_MESH_CLEAR
    G28 ; 归位
    G90 ; 切换到绝对坐标
    G21 ; 使用毫米单位
    M83 ; 使用相对E坐标
    G1 Z15 ; 移动到安全高度
    _PREPARE_TOOL
    {% if printer.extruder.temperature < 125  %}
        M109 S{ 125 }  ; 软化耗材 设置喷嘴温度
    {% endif %}
    _Park_Nozzle
    M106 S127
    M104 S{ extruder_target  }  ; 不等待设置喷嘴目标温度
    {% set preheat_temp = bed_target - 10 %}
    {% if printer.heater_bed.temperature < preheat_temp  %}
        M190 S{ preheat_temp }  ; 等待热床达到目标温度（低10度）
    {% endif %}
    _Wiping_Mouth
    _PACK_UP_TOOL
    M106 S0
    DYNAMIC_Z_CALIBRATION ; 动态Z校准
    SET_Z_OFFSET
    BED_MESH_PROFILE load=carbon ; 加载网床配置
    G1 Z20
    _PREPARE_TOOL
    M106 S127
    _Park_Nozzle
    _Wiping_Mouth
    _Park_Nozzle
    M190 S{ bed_target }       ; 等待热床最终目标温度
    M109 S{ extruder_target }  ; 设置喷嘴目标温度
    G4 S{ bed_temp_even_time } ; 热床较厚，需要多等一会热量均衡
    _PACK_UP_TOOL
    # x
    M106 S0
    G92 E0
    G1 E-1 F100
    # 画直线
    G90
    G1 X0 Y0 F6000
    G1 Z2 F4000
    G92 E0
    G1 Z0.2 F1200
    G1 X30 Y0 E5 F1200
    G92 E0
    G1 X60 Y0 E10 F1200
    G92 E0
    G1 X88 Y0 E2 F1200
    G1 Z2
    G92 E0

[gcode_macro PRINT_END]
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F3600                 ; retract filament
    G91                            ; relative positioning
    TURN_OFF_HEATERS
    SET_LED LED="print_rgb" RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1

    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    G0 Z{z_safe} F3600             ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000  ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G90                            ; absolute positioning
    G0 X60 Y{max_y-10} F3600          ; park nozzle at rear

[gcode_macro PAUSE]
rename_existing:BASE_PAUSE
gcode:
    SAVE_GCODE_STATE NAME=pause_state
    BASE_PAUSE
    G91
    G1 Z13
    G90
    _PREPARE_TOOL
    _Park_Nozzle

[gcode_macro RESUME]
rename_existing:BASE_RESUME
gcode:
    _Move_Toilet
    # 重新提供耗材压力
    M83 ; 相对模式
    G1 E10 F900
    M82 ; 绝对模式
    # 冷却一下挤出的耗材
    M106 S255
    G4 P1200
    M106 S0
    # 刷喷嘴
    {% for i in range(2) %}
        G1 X0 F6000
        G1 X10 F6000
    {% endfor %}
    G1 X35 Y60 F5000
    _CLOSE_TOOL
    G91
    G1 Z-13
    G90
    RESTORE_GCODE_STATE NAME=pause_state MOVE=1
    BASE_RESUME
    SET_SERVO SERVO=servo0 WIDTH=0

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set tool_out_state = printer["gcode_macro COMMON_VAR"].tool_out_state|int %}
    G92 E0
    G1 E-5.0 F100
    # 如果工具栏未弹出
    {% if tool_out_state > 0 %}
        _PREPARE_TOOL
        _PACK_UP_TOOL
    {% endif %}
    M104 S0
    M140 S0
    BASE_CANCEL_PRINT


