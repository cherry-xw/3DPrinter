[gcode_shell_command camera_on]
command: bash /home/biqu/camera.sh on
timeout: 30.
verbose: True

[gcode_shell_command camera_off]
command: bash /home/biqu/camera.sh off
timeout: 30.
verbose: True

[gcode_shell_command camera_stream_on]
command: bash /home/biqu/camera.sh stream-on
timeout: 30.
verbose: True

[gcode_shell_command camera_stream_off]
command: bash /home/biqu/camera.sh stream-off
timeout: 30.
verbose: True

[gcode_shell_command camera_status]
command: bash /home/biqu/camera.sh status
timeout: 15.
verbose: True

# Mainsail 控制台使用 KEY=VALUE 参数，不支持 CAMERA OFF 这种写法。
# CAMERA MODE=ON / CAMERA MODE=OFF：模块级开关
# CAMERA MODE=STREAM_ON / CAMERA MODE=STREAM_OFF：只启停推流
# CAMERA MODE=STATUS：查看状态；不带参数默认查询状态
[gcode_macro CAMERA]
description: USB 摄像头控制，参数 MODE=ON/OFF/STREAM_ON/STREAM_OFF/STATUS
gcode:
    {% set mode = params.MODE|default('STATUS')|upper %}
    {% if mode == 'ON' %}
        RUN_SHELL_COMMAND CMD=camera_on
    {% elif mode == 'OFF' %}
        RUN_SHELL_COMMAND CMD=camera_off
    {% elif mode == 'STREAM_ON' %}
        RUN_SHELL_COMMAND CMD=camera_stream_on
    {% elif mode == 'STREAM_OFF' %}
        RUN_SHELL_COMMAND CMD=camera_stream_off
    {% elif mode == 'STATUS' %}
        RUN_SHELL_COMMAND CMD=camera_status
    {% else %}
        {action_raise_error('用法: CAMERA MODE=ON/OFF/STREAM_ON/STREAM_OFF/STATUS')}
    {% endif %}

[gcode_macro CAMERA_ON]
description: 开启 USB 摄像头
gcode:
    RUN_SHELL_COMMAND CMD=camera_on

[gcode_macro CAMERA_OFF]
description: 关闭 USB 摄像头
gcode:
    RUN_SHELL_COMMAND CMD=camera_off

[gcode_macro CAMERA_STATUS]
description: 查询 USB 摄像头状态
gcode:
    RUN_SHELL_COMMAND CMD=camera_status

[gcode_shell_command test_cmd]
command: pwd
timeout: 2.
verbose: True


[gcode_macro TEST_CMD]
gcode:
    RUN_SHELL_COMMAND CMD=test_cmd