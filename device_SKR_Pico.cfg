# pid_kd: 244.636
#####################################################################
# Fan Control
#####################################################################

# fan1
[fan_generic Air_Purification]
pin: gpio17
max_power: 1.0
kick_start_time: 0.5
off_below: 0.13
cycle_time: 0.010

# fan2
# [fan_generic hotend_fan]
# pin: gpio18
# max_power: 1.0
# kick_start_time: 0.5
# heater_temp: 50.0

# fan3 根据pi温度控制风扇
# target_temp: 52.0 是 58 与 46 的中点（模拟滞后行为的关键）；
# pid_Kp: 8.0 是主要的控制强度，越高响应越像“开关”；
# pid_Ki: 0.05 控制积分项，让风扇在目标附近温度保持稳定输出；
# pid_Kd: 0.0 设为 0 表示不启用微分控制；
[temperature_fan Pi_Fan]
pin: gpio20
max_power: 1.0
kick_start_time: 0.5
sensor_type: temperature_host
control: pid
target_temp: 60
max_power: 1.0

pid_Kp: 20.0
pid_Ki: 0.5
pid_Kd: 100.0
max_speed: 0.75
min_speed: 0.0
min_temp: 0
max_temp: 100

